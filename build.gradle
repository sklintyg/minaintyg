plugins {
    alias(libs.plugins.com.github.ben.manes.versions)
    alias(libs.plugins.com.diffplug.spotless)
    alias(libs.plugins.org.cyclonedx.bom)
    alias(libs.plugins.org.sonarqube)
    alias(libs.plugins.org.springframework.boot)
}

apply from: 'gradle/configureIntygBom.gradle'

// Temporary security pins. Remove both once intygBomVersion provides a Spring Boot that manages
// netty >= 4.1.135.Final and reactor-netty >= 1.2.18.
// nettyBom: fixes the netty DNS resolver CVEs (CVE-2026-45674, CVE-2026-47691, CVE-2026-45673).
// reactorBom: brings reactor-netty >= 1.2.18, the first version defaulting the DNS resolver to
// ChannelPerResolution, which restores UDP source port entropy (second factor of CVE-2026-45673).
def nettyBomVersion = '4.1.137.Final'
def reactorBomVersion = '2024.0.18'

springBoot {
    mainClass = 'se.inera.intyg.minaintyg.MinaintygApplication'
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'test-report-aggregation'

    group = 'se.inera.intyg.minaintyg'
    version = System.properties['buildVersion'] ?: '4.1.0-SNAPSHOT'

    repositories {
        mavenLocal()
        maven { url "https://nexus.drift.inera.se/repository/it-public/" }
        maven { url 'https://build.shibboleth.net/nexus/content/repositories/releases/' }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    spotless {
        java {
            target 'src/*/java/**/*.java'
            licenseHeaderFile(rootProject.file('spotless.license.txt'), 'package ')
            googleJavaFormat(googleJavaFormatVersion)
            removeUnusedImports()
            forbidWildcardImports()
            formatAnnotations()
        }
    }

    configurations {
        mockitoAgent
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    compileJava {
        options.encoding = "UTF-8"
        options.compilerArgs.add("-parameters")
    }

    dependencies {
        implementation platform("se.inera.intyg.bom:platform:${intygBomVersion}")
        implementation platform("io.netty:netty-bom:${nettyBomVersion}") // Temporary CVE hotfix (CVE-2026-45674, CVE-2026-47691).
        implementation platform("io.projectreactor:reactor-bom:${reactorBomVersion}")
        annotationProcessor platform("se.inera.intyg.bom:platform:${intygBomVersion}")
        annotationProcessor platform("io.netty:netty-bom:${nettyBomVersion}")
        annotationProcessor platform("io.projectreactor:reactor-bom:${reactorBomVersion}")
        testImplementation platform("se.inera.intyg.bom:platform:${intygBomVersion}")
        testImplementation platform("io.netty:netty-bom:${nettyBomVersion}")
        testImplementation platform("io.projectreactor:reactor-bom:${reactorBomVersion}")
        testAnnotationProcessor platform("se.inera.intyg.bom:platform:${intygBomVersion}")
        testAnnotationProcessor platform("io.netty:netty-bom:${nettyBomVersion}")
        testAnnotationProcessor platform("io.projectreactor:reactor-bom:${reactorBomVersion}")
        mockitoAgent platform("se.inera.intyg.bom:platform:${intygBomVersion}")
        mockitoAgent platform("io.netty:netty-bom:${nettyBomVersion}")
        mockitoAgent platform("io.projectreactor:reactor-bom:${reactorBomVersion}")
        mockitoAgent("org.mockito:mockito-core") { transitive = false }
    }

    test {
        jvmArgs += [
                "-javaagent:${configurations.mockitoAgent.asPath}",
                "-Xshare:off"
        ]
    }

    testing {
        suites {
            test {
                useJUnitJupiter()
            }
        }
    }

    jacocoTestReport {
        dependsOn test

        reports {
            xml.required = true
            html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
        }

        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        "**/testability/**",
                        "**/integrationtest/**",
                ])
            }))
        }
    }

    tasks.matching { it.name == "cyclonedxDirectBom" }.configureEach { t ->
        t.includeConfigs = ['^runtimeClasspath$']
    }
}

reporting {
    reports {
        integrationTestAggregateTestReport(AggregateTestReport) {
            testSuiteName = 'integrationTest'
        }
    }

    subprojects.collect { subproject -> subproject.name }.each { subprojectName ->
        dependencies { testReportAggregation project(":${subprojectName}") }
    }
}

sonar {
    properties {
        property "sonar.projectKey", "intyg-minaintyg"
        property "sonar.projectName", "intyg-minaintyg"
        property "sonar.exclusions", "**/integration/api/**/*,**/testability/**,**/dto/**/*,**/integrationtest/**"
    }
}
